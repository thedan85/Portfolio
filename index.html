<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hứa Thế Dân — Backend Developer</title>
  <meta name="description" content="Backend developer specializing in Java, C#, Spring Boot and ASP.NET. Software engineering student at Sai Gon University." />
  <script>
    (() => {
      const stored = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <a class="skip-link" href="#hero">Skip to content</a>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo" id="nav-logo" aria-label="Home"></a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="#hero" class="nav-link"><span>01</span>Home</a></li>
        <li><a href="#about" class="nav-link"><span>02</span>About</a></li>
        <li><a href="#projects" class="nav-link"><span>03</span>Projects</a></li>
      </ul>
      <div class="nav-contact" id="nav-contact">
        <!-- Contact links injected dynamically -->
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-controls="nav-menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ========== HERO ========== -->
  <section class="hero" id="hero">
    <div class="container hero-container">
      <div class="hero-content reveal">
        <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Software engineering student</p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-intro" id="hero-intro"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary">View projects <span aria-hidden="true">&darr;</span></a>
          <a href="#" class="btn btn-outline" id="hero-email">Email me</a>
        </div>
      </div>

      <div class="hero-meta reveal">
        <div class="meta-item">
          <span class="meta-label">Focus</span>
          <span class="meta-value">Backend systems</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Backend</span>
          <span class="meta-value" id="hero-stack"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Study</span>
          <span class="meta-value" id="hero-school"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== ABOUT ========== -->
  <section class="section section-ruled" id="about">
    <div class="container">
      <header class="section-head reveal">
        <span class="section-index" aria-hidden="true">01</span>
        <h2 class="section-title">About</h2>
      </header>
      <div class="about-grid reveal">
        <div class="about-text" id="about-text"></div>
        <div class="about-details">
          <div class="about-card">
            <h3>Education</h3>
            <div id="about-education"></div>
          </div>
          <div class="about-card">
            <h3>Tech stack</h3>
            <div id="about-tech"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== PROJECTS ========== -->
  <section class="section section-ruled" id="projects">
    <div class="container">
      <header class="section-head reveal">
        <span class="section-index" aria-hidden="true">02</span>
        <h2 class="section-title">Selected work</h2>
      </header>
      <div class="projects-list reveal" id="projects-grid">
        <!-- Projects injected dynamically from index.js -->
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container footer-content">
      <p id="footer-copy"></p>
      <div class="footer-socials" id="footer-socials">
        <!-- Social links injected dynamically -->
      </div>
    </div>
  </footer>

  <script src="index.js"></script>
</body>
</html>
